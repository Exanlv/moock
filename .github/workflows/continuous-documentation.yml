name: Auto update docs

on:
  push:
    branches:
      - main

jobs:
  update-docs:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4

      - name: Install packages
        run: composer install --prefer-dist --no-progress

      - name: Generate general documentation
        run: php docs/generators/docs.php > docs/documentation.md

      - name: Generate arg validation documentation
        run: php docs/generators/arg-validation.php > docs/arg-validation.md

      - name: Commit and push if changed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git add -A
            git commit -m "Update docs"
            git push
          else
            echo "No changes"
          fi
